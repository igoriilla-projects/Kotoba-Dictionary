name: YarxiStudy
options:
  developmentLanguage: ru
  bundleIdPrefix: local.yarxi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    KOTOBA_DICTIONARY_PATH: "$(SRCROOT)/Data/dictionary.sqlite"
    PRODUCT_NAME: "$(TARGET_NAME)"
targets:
  YarxiStudy:
    type: application
    platform: macOS
    sources:
      - App
      - path: Resources
        buildPhase: resources
      - path: Assets/Kotoba.icns
        buildPhase: resources
      - Shared
      - Vendor/SwiftFSRS
      - path: Vendor/SwiftFSRS/LICENSE
        buildPhase: resources
      - path: docs/Kotoba-Changelog.txt
        buildPhase: resources
    postBuildScripts:
      - &bundleDictionary
        name: Bundle dictionary
        inputFiles:
          - "$(KOTOBA_DICTIONARY_PATH)"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/dictionary.sqlite"
        script: |
          set -eu
          mkdir -p "$(dirname "$SCRIPT_OUTPUT_FILE_0")"
          cp -f "$SCRIPT_INPUT_FILE_0" "$SCRIPT_OUTPUT_FILE_0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.yarxi.study
        PRODUCT_NAME: Kotoba
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - target: YarxiStudyWidget
        embed: true
      - sdk: libsqlite3.tbd
  YarxiStudyWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - path: Resources
        buildPhase: resources
      - Shared
      - Vendor/SwiftFSRS
      - path: Vendor/SwiftFSRS/LICENSE
        buildPhase: resources
    postBuildScripts:
      - *bundleDictionary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.yarxi.study.widget
        INFOPLIST_FILE: Config/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Widget.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
    dependencies:
      - sdk: libsqlite3.tbd
schemes:
  YarxiStudy:
    build:
      targets:
        YarxiStudy: all
